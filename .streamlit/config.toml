# DELIMIT brand theme - see brand design guide (fonts, colors) shared
# 2026-07-17. Font files are bundled in static/fonts/ and served via
# Streamlit's static file serving (required for [[theme.fontFaces]]
# to load local files).

[server]
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#557399"
backgroundColor = "#FAF8F4"
secondaryBackgroundColor = "#F1EEE8"
textColor = "#1A1815"

font = "IBM Plex Sans"
headingFont = "IBM Plex Sans"
headingFontWeights = [600, 500, 500, 500, 500, 500]
codeFont = "Space Mono"
baseFontSize = 18

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Light.ttf"
weight = "300"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Regular.ttf"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Medium.ttf"
weight = "500"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-SemiBold.ttf"
weight = "600"
style = "normal"

[[theme.fontFaces]]
family = "Space Mono"
url = "app/static/fonts/SpaceMono-Regular.ttf"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "Space Mono"
url = "app/static/fonts/SpaceMono-Bold.ttf"
weight = "700"
style = "normal"
